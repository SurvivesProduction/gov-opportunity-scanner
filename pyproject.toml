[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oppscanner"
version = "0.1.0"
description = "Generic framework for tracking active/upcoming government contract-bid and permit opportunities across multiple jurisdictions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "SurvivesProduction" }]
dependencies = [
    "pydantic>=2.6,<3",
    "psycopg[binary]>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "truststore>=0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oppscanner"]

[tool.hatch.build.targets.sdist]
include = [
    "src/oppscanner",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
